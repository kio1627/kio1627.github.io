<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛逼高速机场</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    background:#121212;
    color:#fff;
    padding:20px;
    max-width:500px;
    margin:0 auto;
}

.site-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin:40px 0 10px;
}

.site-desc{
    text-align:center;
    color:#999;
    font-size:13px;
    line-height:1.7;
    margin-bottom:30px;
}

.card{
    background:#1c1c1e;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
}

.card h3{
    font-size:19px;
    margin-bottom:10px;
}

.card .tag{
    display:inline-block;
    background:#2a2a2a;
    padding:4px 10px;
    border-radius:12px;
    font-size:13px;
    margin-right:6px;
    margin-bottom:8px;
    color:#ddd;
}

.price{
    font-size:24px;
    font-weight:bold;
    color:#ff3b30;
    margin:12px 0;
}

.buy{
    display:block;
    background:#007aff;
    color:#fff;
    text-align:center;
    text-decoration:none;
    border-radius:14px;
    padding:15px;
    width:100%;
    font-size:16px;
    font-weight:500;
}

.unlimited-card{
    border:2px solid #ff3b30;
    background:linear-gradient(
        135deg,
        #1c1c1e 0%,
        #2a1a1a 100%
    );
}

.unlimited-card .tag{
    background:#ff3b30;
    color:#fff;
}

.custom{
    background:#1c1c1e;
    border-radius:18px;
    padding:22px;
    margin-top:25px;
    text-align:center;
}

.custom h3{
    font-size:18px;
    margin-bottom:8px;
}

.custom p{
    color:#999;
    font-size:13px;
    margin-bottom:15px;
}

.custom a{
    display:block;
    background:#007aff;
    color:#fff;
    text-decoration:none;
    border-radius:14px;
    padding:14px;
}
</style>
</head>

<body>

<div class="site-title">

</div>
