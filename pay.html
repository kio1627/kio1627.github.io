<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>确认订单 - 牛逼高速节点</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 0%,#16365d 0%,#091725 42%,#040b13 100%);
    color:#fff;
    padding:30px 16px 60px;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
}

.header{
    text-align:center;
    padding:25px 0 30px;
}

.header h1{
    font-size:30px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:10px;
}

.header p{
    color:#8997a9;
    font-size:14px;
}

.order{
    background:rgba(15,29,45,.95);
    border:1px solid #283e56;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.order-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
}

.info{
    background:#0a1827;
    border:1px solid #293e55;
    border-radius:14px;
    padding:15px;
    margin-bottom:22px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:9px 0;
    font-size:14px;
}

.info-row span:first-child{
    color:#8997a9;
}

.info-row span:last-child{
    color:#fff;
    font-weight:600;
    text-align:right;
}

.info-row .price{
    color:#43aaff;
    font-size:25px;
    font-weight:800;
}

.form-group{
    margin-top:18px;
}

label{
    display:block;
    color:#c5d0dc;
    font-size:14px;
    margin-bottom:9px;
}

input{
    width:100%;
    height:48px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid #293e55;
    outline:none;
    background:#081522;
    color:#fff;
    font-size:15px;
}

input::placeholder{
    color:#56677b;
}

input:focus{
    border-color:#147fe5;
}

.tip{
    margin-top:9px;
    color:#718197;
    font-size:12px;
    line-height:1.7;
}

.pay{
    width:100%;
    height:50px;
    margin-top:23px;
    border:0;
    border-radius:13px;
    background:#147fe5;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.pay:active{
    transform:scale(.98);
}

.back{
    display:block;
    text-align:center;
    color:#718197;
    text-decoration:none;
    font-size:13px;
    margin-top:18px;
}

.footer{
    text-align:center;
    color:#56677b;
    font-size:12px;
    margin-top:25px;
}
</style></head><body><div class="container"><div class="header">
    <h1>确认订单</h1>
    <p>请确认套餐信息并填写邮箱</p>
</div>

<div class="order">

    <div class="order-title">
        订单信息
    </div>

    <div class="info">

        <div class="info-row">
            <span>套餐</span>
            <span id="planName">加载中...</span>
        </div>

        <div class="info-row">
            <span>价格</span>
            <span class="price" id="planPrice">¥0</span>
        </div>

    </div>

    <div class="form-group">

        <label for="email">
            邮箱地址
        </label>

        <input
            type="email"
            id="email"
            placeholder="请输入你的邮箱"
            autocomplete="email"
        >

        <div class="tip">
            请填写正确的邮箱地址，用于接收购买后的相关信息。
        </div>

    </div>

    <button
        class="pay"
        onclick="submitOrder()">
        确认并支付
    </button>

    <a
        class="back"
        href="index.html">
        ← 返回套餐页面
    </a>

</div>

<div class="footer">
    牛逼高速节点 · 高速稳定 · 流媒体解锁
</div>

</div><script>

/* 获取 index.html 传来的价格 */

const params = new URLSearchParams(
    window.location.search
);

const price = params.get("price");


/*
 * 套餐价格、名称、支付宝链接
 */

const plans = {

    "42":{
        name:"永久入门版",
        pay:"https://qr.alipay.com/2m619623xv33h5d9z8bsuf4"
    },

    "68":{
        name:"年度基础版",
        pay:"https://qr.alipay.com/2m613255wknd2i53wtuvic9"
    },

    "98":{
        name:"永久大容量版",
        pay:"https://qr.alipay.com/2m619014hxogm5nnlgwg8b0"
    },

    "128":{
        name:"年度标准版",
        pay:"https://qr.alipay.com/2m6131519umeui8qcxnag17"
    },

    "188":{
        name:"年度旗舰版",
        pay:"https://qr.alipay.com/2m617394fusiob5xhmhsm83"
    },

    "288":{
        name:"年度无限流量版",
        pay:"https://qr.alipay.com/2m618349n44bqr0c2bropa4"
    }

};


/* 找到当前套餐 */

const plan = plans[price];


/* 显示套餐 */

if(plan){

    document.getElementById("planName").textContent =
        plan.name;

    document.getElementById("planPrice").textContent =
        "¥" + price;

}else{

    document.getElementById("planName").textContent =
        "套餐不存在";

    document.getElementById("planPrice").textContent =
        "¥0";

}


/* 提交订单 */

function submitOrder(){

    if(!plan){

        alert("套餐信息错误，请返回重新选择");

        return;
    }


    const email =
        document.getElementById("email").value.trim();


    /* 检查邮箱 */

    if(!email){

        alert("请输入邮箱地址");

        document.getElementById("email").focus();

        return;
    }


    /* 邮箱格式 */

    const emailReg =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailReg.test(email)){

        alert("请输入正确的邮箱地址");

        document.getElementById("email").focus();

        return;
    }


    /*
     * 保存邮箱
     */

    localStorage.setItem(
        "order_email",
        email
    );


    /*
     * 保存本次订单信息
     */

    localStorage.setItem(
        "order_price",
        price
    );

    localStorage.setItem(
        "order_plan",
        plan.name
    );


    /*
     * 跳转支付宝
     */

    window.location.href =
        plan.pay;

}

</script></body>
</html>
