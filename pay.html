<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 - 牛逼高速节点</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 50% -10%,#102d4d 0%,#071523 40%,#050c14 100%);
    color:#fff;
}

.page{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:70px 20px 50px;
}

.title{
    text-align:center;
    margin-bottom:55px;
}

.title h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:14px;
}

.title p{
    font-size:23px;
    color:#8b9aad;
}

.order-card{
    background:rgba(16,29,44,.96);
    border:1px solid #293e55;
    border-radius:32px;
    padding:42px 48px;
    box-shadow:
    0 20px 50px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.02);
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:76px;
    border-bottom:1px solid #263a50;
}

.info-row:last-of-type{
    border-bottom:none;
}

.info-left{
    color:#9aa7b8;
    font-size:21px;
}

.info-right{
    color:#f3f6fa;
    font-size:21px;
    font-weight:700;
}

.amount-box{
    margin-top:34px;
    margin-bottom:42px;
    display:flex;
    align-items:baseline;
    gap:10px;
}

.amount{
    color:#45aaff;
    font-size:55px;
    font-weight:800;
}

.amount-label{
    color:#8b98a9;
    font-size:20px;
}

.email-title{
    font-size:21px;
    color:#d9e0e8;
    margin-bottom:16px;
}

.required{
    color:#45aaff;
}

.email{
    width:100%;
    height:64px;
    padding:0 20px;
    border-radius:17px;
    border:1px solid #334a63;
    background:#07111d;
    color:#fff;
    font-size:20px;
    outline:none;
}

.email:focus{
    border-color:#268be9;
    box-shadow:0 0 0 2px rgba(38,139,233,.12);
}

.email::placeholder{
    color:#657386;
}

.email-tip{
    color:#778598;
    font-size:17px;
    line-height:1.7;
    margin-top:12px;
}

.pay-title{
    font-size:21px;
    color:#d9e0e8;
    margin-top:38px;
    margin-bottom:16px;
}

.alipay{
    width:100%;
    min-height:116px;
    border:2px solid #2b5f8d;
    border-radius:20px;
    background:#091927;
    display:flex;
    align-items:center;
    padding:20px 28px;
    cursor:pointer;
    transition:.2s;
}

.alipay:active{
    transform:scale(.99);
}

.alipay-icon{
    width:68px;
    height:68px;
    border-radius:17px;
    background:#1677ed;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:800;
    margin-right:22px;
}

.alipay-text strong{
    display:block;
    font-size:25px;
    margin-bottom:8px;
}

.alipay-text span{
    color:#8291a3;
    font-size:17px;
}

.contact{
    text-align:center;
    margin-top:28px;
    color:#778596;
    font-size:15px;
    line-height:1.8;
}

.contact a{
    color:#45aaff;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#7d8b9c;
    text-decoration:none;
    font-size:16px;
}

@media(max-width:600px){

    .page{
        padding:55px 18px 40px;
    }

    .title{
        margin-bottom:45px;
    }

    .title h1{
        font-size:36px;
    }

    .title p{
        font-size:21px;
    }

    .order-card{
        padding:30px 28px;
        border-radius:28px;
    }

    .info-row{
        min-height:70px;
    }

    .info-left,
    .info-right{
        font-size:18px;
    }

    .amount{
        font-size:49px;
    }

    .amount-label{
        font-size:18px;
    }

    .email-title,
    .pay-title{
        font-size:19px;
    }

    .email{
        height:60px;
        font-size:17px;
    }

    .email-tip{
        font-size:15px;
    }

    .alipay{
        padding:17px;
        min-height:105px;
    }

    .alipay-icon{
        width:60px;
        height:60px;
        font-size:32px;
        margin-right:17px;
    }

    .alipay-text strong{
        font-size:21px;
    }

    .alipay-text span{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="title">
        <h1>确认订单</h1>
        <p>牛逼高速节点</p>
    </div>

    <div class="order-card">

        <div class="info-row">
            <span class="info-left">套餐</span>
            <span class="info-right" id="planName">年度基础版</span>
        </div>

        <div class="info-row">
            <span class="info-left">流量</span>
            <span class="info-right" id="traffic">200GB/月</span>
        </div>

        <div class="info-row">
            <span class="info-left">有效期</span>
            <span class="info-right" id="period">1年</span>
        </div>

        <div class="amount-box">
            <span class="amount">¥<span id="price">68</span></span>
            <span class="amount-label">应付金额</span>
        </div>

        <div class="email-title">
            接收邮箱 <span class="required">*</span>
        </div>

        <input
            id="email"
            class="email"
            type="email"
            placeholder="请输入接收邮箱（必填）"
        >

        <div class="email-tip">
            下单请填写接收邮箱，邮箱用于接收订单信息，填写后才能支付。
        </div>

        <div class="pay-title">
            支付方式
        </div>

        <div class="alipay" id="alipayBtn">

            <div class="alipay-icon">
                支
            </div>

            <div class="alipay-text">
                <strong>支付宝支付</strong>
                <span>支持支付宝扫码或跳转支付</span>
            </div>

        </div>

        <div class="contact">
            如遇问题联系客服<br>
            <a href="https://t.me/kio_037" target="_blank">
                Telegram：@kio_037
            </a>
        </div>

        <a class="back" href="javascript:history.back()">
            返回上一页
        </a>

    </div>

</div>

<script>

const params = new URLSearchParams(location.search);
const price = params.get("price");

const plans = {

    "42":{
        name:"永久入门版",
        traffic:"200GB",
        period:"永久"
    },

    "68":{
        name:"年度基础版",
        traffic:"200GB/月",
        period:"1年"
    },

    "98":{
        name:"永久大容量版",
        traffic:"2TB",
        period:"永久"
    },

    "128":{
        name:"年度标准版",
        traffic:"1000GB/月",
        period:"1年"
    },

    "188":{
        name:"年度旗舰版",
        traffic:"3000GB/月",
        period:"1年"
    },

    "288":{
        name:"年度无限流量版",
        traffic:"无限流量",
        period:"1年"
    }

};

const alipayLinks = {

    "42":
    "https://qr.alipay.com/2m616131bcknnzkddkskkd5",

    "68":
    "https://qr.alipay.com/2m617728iqomyzupkxiqke5",

    "98":
    "https://qr.alipay.com/2m618938m9ydqkhrsmlmqee",

    "128":
    "https://qr.alipay.com/2m613355qwofxnkomwaqqf0",

    "188":
    "https://qr.alipay.com/2m615093g3amu5rltcxn1e6",

    "288":
    "https://qr.alipay.com/2m611308ww3ce4zwz5z7c0f"

};

if(plans[price]){

    document.getElementById("planName").textContent =
        plans[price].name;

    document.getElementById("traffic").textContent =
        plans[price].traffic;

    document.getElementById("period").textContent =
        plans[price].period;

    document.getElementById("price").textContent =
        price;

}

document.getElementById("alipayBtn").onclick = function(){

    const email =
        document.getElementById("email").value.trim();

    if(!email){
        alert("请填写接收邮箱");
        document.getElementById("email").focus();
        return;
    }

    const emailReg =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailReg.test(email)){
        alert("请输入正确的邮箱地址");
        document.getElementById("email").focus();
        return;
    }

    if(!alipayLinks[price]){
        alert("当前套餐暂未配置支付链接");
        return;
    }

    window.location.href = alipayLinks[price];

};

</script>

</body>
</html>
