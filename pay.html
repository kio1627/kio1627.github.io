<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 - 青梧网络</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
    min-height: 100vh;
    background: radial-gradient(
        circle at 50% 0%,
        #16365d 0%,
        #091725 42%,
        #040b13 100%
    );
    color: #fff;
    padding: 30px 16px 60px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

.header {
    text-align: center;
    padding: 25px 0 30px;
}

.header h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.header p {
    color: #8997a9;
    font-size: 14px;
}

.order {
    background: rgba(15, 29, 45, .95);
    border: 1px solid #283e56;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
}

.order-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
}

.info {
    background: #0a1827;
    border: 1px solid #293e55;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 22px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 9px 0;
    font-size: 14px;
}

.info-row span:first-child {
    color: #8997a9;
}

.info-row span:last-child {
    color: #fff;
    font-weight: 600;
    text-align: right;
    overflow-wrap: anywhere;
}

.info-row .price {
    color: #43aaff;
    font-size: 25px;
    font-weight: 800;
}

.form-group {
    margin-top: 18px;
}

label {
    display: block;
    color: #c5d0dc;
    font-size: 14px;
    margin-bottom: 9px;
}

.required {
    color: #ff7474;
    margin-left: 4px;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid #293e55;
    outline: none;
    background: #081522;
    color: #fff;
    font-size: 15px;
}

input::placeholder {
    color: #56677b;
}

input:focus {
    border-color: #147fe5;
}

input.invalid {
    border-color: #ff7474;
}

.tip {
    margin-top: 9px;
    color: #718197;
    font-size: 12px;
    line-height: 1.7;
}

.error {
    display: none;
    color: #ff8585;
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.6;
}

.error.show {
    display: block;
}

.pay {
    width: 100%;
    min-height: 50px;
    margin-top: 23px;
    border: 0;
    border-radius: 13px;
    background: #147fe5;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.pay:active {
    transform: scale(.98);
}

.pay:disabled {
    opacity: .65;
    cursor: wait;
}

.back {
    display: block;
    text-align: center;
    color: #718197;
    text-decoration: none;
    font-size: 13px;
    margin-top: 18px;
}

.back:hover {
    color: #43aaff;
}

.footer {
    text-align: center;
    color: #56677b;
    font-size: 12px;
    margin-top: 25px;
}

@media (max-width: 450px) {
    body {
        padding: 25px 14px 50px;
    }

    .header h1 {
        font-size: 27px;
    }

    .order {
        padding: 21px;
    }
}
</style>
</head>

<body>
<div class="container">

    <!-- 页面标题 -->
    <div class="header">
        <h1>确认订单</h1>
        <p>请确认套餐信息并填写接收邮箱</p>
    </div>

    <!-- 订单信息 -->
    <div class="order">

        <div class="order-title">订单信息</div>

        <div class="info">
            <div class="info-row">
                <span>套餐</span>
                <span id="planName">加载中...</span>
            </div>

            <div class="info-row">
                <span>价格</span>
                <span class="price" id="planPrice">¥0</span>
            </div>
        </div>

        <!-- 接收邮箱 -->
        <div class="form-group">
            <label for="email">
                接收邮箱<span class="required">*</span>
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="请输入接收订单信息的邮箱"
                autocomplete="email"
                maxlength="254"
                required
            >

            <div class="tip">
                下单请填写接收邮箱，必须填写邮箱才能支付。
                请确认邮箱地址正确，以便接收购买后的相关信息。
            </div>

            <div class="error" id="emailError" role="alert">
                请输入正确的邮箱地址。
            </div>
        </div>

        <!-- 支付按钮 -->
        <button
            type="button"
            class="pay"
            id="payButton"
            onclick="submitOrder()"
        >
            确认并支付
        </button>

        <a class="back" href="index.html">
            ← 返回套餐页面
        </a>

    </div>

    <div class="footer">
        青梧网络 · 高速稳定 · 流媒体解锁
    </div>

</div>

<script>
/* 获取套餐价格 */
const params = new URLSearchParams(window.location.search);
const price = params.get("price");

/* 套餐名称及支付宝收款链接 */
const plans = {
    "42": {
        name: "永久入门版",
        pay: "https://qr.alipay.com/2m613195ha5unrhxterel77"
    },

    "68": {
        name: "年度基础版",
        pay: "https://qr.alipay.com/2m618670izie8lpqkxylh65"
    },

    "98": {
        name: "永久大容量版",
        pay: "https://qr.alipay.com/2m619324r4c0ggebuec4dc9"
    },

    "128": {
        name: "年度标准版",
        pay: "https://qr.alipay.com/2m613520h28f0q6ltysgi5f"
    },

    "188": {
        name: "年度旗舰版",
        pay: "https://qr.alipay.com/2m617394fusiob5xhmhsm83"
    },

    "288": {
        name: "年度无限流量版",
        pay: "https://qr.alipay.com/2m618349n44bqr0c2bropa4"
    }
};

/* 获取页面元素 */
const planNameElement = document.getElementById("planName");
const planPriceElement = document.getElementById("planPrice");
const emailInput = document.getElementById("email");
const emailError = document.getElementById("emailError");
const payButton = document.getElementById("payButton");

/* 当前套餐 */
const plan = plans[price];

/* 显示套餐 */
if (plan) {
    planNameElement.textContent = plan.name;
    planPriceElement.textContent = "¥" + price;
} else {
    planNameElement.textContent = "套餐不存在";
    planPriceElement.textContent = "—";
    payButton.disabled = true;
    payButton.textContent = "套餐信息错误";
}

/* 邮箱验证 */
function validateEmail() {
    const email = emailInput.value.trim();

    const emailReg =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email) {
        emailError.textContent = "请填写接收邮箱，必须填写邮箱才能支付。";
        emailError.classList.add("show");
        emailInput.classList.add("invalid");
        emailInput.focus();
        return false;
    }

    if (!emailReg.test(email)) {
        emailError.textContent = "邮箱格式不正确，请检查后重新填写。";
        emailError.classList.add("show");
        emailInput.classList.add("invalid");
        emailInput.focus();
        return false;
    }

    emailError.classList.remove("show");
    emailInput.classList.remove("invalid");

    return true;
}

/* 输入时清除旧错误提示 */
emailInput.addEventListener("input", function () {
    emailError.classList.remove("show");
    emailInput.classList.remove("invalid");
});

/* 提交订单并跳转支付宝 */
function submitOrder() {
    if (!plan) {
        alert("套餐信息错误，请返回套餐页面重新选择。");
        return;
    }

    if (!validateEmail()) {
        return;
    }

    const email = emailInput.value.trim();

    /*
     * 保存本地订单信息。
     * 注意：localStorage 只保存在当前浏览器，
     * 不会自动发送到商家后台。
     */
    try {
        localStorage.setItem("order_email", email);
        localStorage.setItem("order_price", price);
        localStorage.setItem("order_plan", plan.name);
    } catch (error) {
        /* 浏览器禁止本地存储时，不影响继续支付 */
    }

    /* 跳转对应支付宝收款链接 */
    window.location.href = plan.pay;
}
</script>

</body>
</html>
